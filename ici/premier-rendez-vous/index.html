<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premier rendez-vous — ICI.</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="shell">
<header class="topbar"><a class="brand" href="../">ICI. <small>par CartoKob</small></a><nav class="nav"><a href="../">Boutique</a><a href="/">CartoKob</a></nav></header>
<a class="back" href="../">← Retour à la boutique</a>
<section class="hero"><div class="kicker">Produit 02</div><h1>Premier rendez-vous</h1><p>Un lieu précis, dessiné comme une vraie carte à offrir.</p></section>
<div class="form"><div class="field"><label>Lieu</label><input id="place" placeholder="Restaurant, parc, rue, adresse"></div><div class="two"><div class="field"><label>Date</label><input id="date" placeholder="14.02.2004"></div><div class="field"><label>Prénoms</label><input id="names" placeholder="Camille & Alex"></div></div></div>
<div class="controls"><button class="pill active" data-mode="trace">Tracé</button><button class="pill" data-mode="carto">Carto</button></div>
<div class="controls"><button class="pill active" data-theme="epure">Ivoire</button><button class="pill" data-theme="night">Nuit</button><button class="pill" data-theme="atlas">Atlas</button><button class="pill" data-theme="vintage">Papier</button></div>
<button class="generate" id="go">Générer ma carte</button><div class="status" id="status"></div>
<div class="preview" id="preview"><div class="poster"><svg id="poster" viewBox="0 0 800 1000"></svg></div><div class="actions"><button class="btn dark" id="png">Télécharger SD</button><button class="btn" id="svg">SVG aperçu</button></div></div>
<footer class="footer">ICI. par CartoKob</footer></main>
<script src="../assets/core.js"></script><script>
let theme="epure",mode="trace";ICI.$$("[data-theme]").forEach(b=>b.onclick=()=>{theme=b.dataset.theme;ICI.$$("[data-theme]").forEach(x=>x.classList.toggle("active",x===b))});ICI.$$("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;ICI.$$("[data-mode]").forEach(x=>x.classList.toggle("active",x===b))});
ICI.$("#go").onclick=async()=>{const q=ICI.$("#place").value.trim();if(!q){ICI.$("#status").textContent="Renseignez le lieu.";return}const btn=ICI.$("#go");btn.disabled=true;try{ICI.$("#status").textContent="Recherche du lieu…";const P=await ICI.geocode(q);const km=mode==="carto"?1.5:1.15,latR=km/111.32,lonR=km/(111.32*Math.max(.25,Math.cos(P.lat*Math.PI/180))),box={s:P.lat-latR,w:P.lon-lonR,n:P.lat+latR,e:P.lon+lonR};ICI.$("#status").textContent="Dessin de la carte…";const fs=await ICI.features(box,mode==="carto");if(!fs.some(f=>f.kind==="road"))throw new Error("Réseau routier indisponible. Réessayez.");const bounds=[[box.w,box.s],[box.e,box.s],[box.e,box.n],[box.w,box.n]],p=ICI.projector(bounds),t=ICI.themes[theme],pt=p.project([P.lon,P.lat]);let s=ICI.base("PREMIER RENDEZ-VOUS",ICI.$("#date").value.trim()||"Un lieu. Une date.",t)+ICI.featureSvg(fs,p,t,mode==="carto");s+='<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="30" fill="'+t.bg+'" fill-opacity=".7" stroke="'+t.a+'" stroke-width="2.5"/><circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="7" fill="'+t.a+'"/>';const names=ICI.$("#names").value.trim();s+=ICI.bottom(names||ICI.short(q),(names?ICI.short(q)+" · ":"")+"Notre premier rendez-vous",t,P.lat.toFixed(5)+"° N · "+P.lon.toFixed(5)+"° E");ICI.$("#poster").innerHTML=s;ICI.$("#preview").classList.add("show");ICI.$("#status").textContent="Carte générée · "+fs.filter(f=>f.kind==="road").length+" voies."}catch(e){ICI.$("#status").textContent=e.message}finally{btn.disabled=false}};
ICI.$("#png").onclick=()=>ICI.download("poster","ici-premier-rendez-vous",true);ICI.$("#svg").onclick=()=>ICI.download("poster","ici-premier-rendez-vous-apercu",false);
</script></body></html>
