<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nos chemins — ICI.</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="shell">
<header class="topbar"><a class="brand" href="../">ICI. <small>par CartoKob</small></a><nav class="nav"><a href="../">Boutique</a><a href="/">CartoKob</a></nav></header>
<a class="back" href="../">← Retour à la boutique</a>
<section class="hero"><div class="kicker">Produit 01</div><h1>Nos chemins</h1><p>Deux lieux de départ. Deux trajets réels. Un point où tout commence.</p></section>
<div class="form"><div class="field"><label>J’habitais ici</label><input id="a" placeholder="Ville, rue ou adresse"></div><div class="field"><label>L’autre habitait ici</label><input id="b" placeholder="Ville, rue ou adresse"></div><div class="field"><label>On s’est rencontrés ici</label><input id="m" placeholder="Lieu de rencontre"></div></div>
<div class="controls"><button class="pill active" data-theme="epure">Épure</button><button class="pill" data-theme="night">Nuit</button><button class="pill" data-theme="atlas">Atlas</button><button class="pill" data-theme="vintage">Vintage</button></div>
<button class="generate" id="go">Générer ma carte</button><div class="status" id="status"></div>
<div class="preview" id="preview"><div class="poster"><svg id="poster" viewBox="0 0 800 1000"></svg></div><div class="actions"><button class="btn dark" id="png">Télécharger SD</button><button class="btn" id="svg">SVG aperçu</button></div></div>
<footer class="footer">ICI. par CartoKob</footer></main>
<script src="../assets/core.js"></script><script>
let theme="epure";ICI.$$("[data-theme]").forEach(b=>b.onclick=()=>{theme=b.dataset.theme;ICI.$$("[data-theme]").forEach(x=>x.classList.toggle("active",x===b))});
ICI.$("#go").onclick=async()=>{const qA=ICI.$("#a").value.trim(),qB=ICI.$("#b").value.trim(),qM=ICI.$("#m").value.trim();if(!qA||!qB||!qM){ICI.$("#status").textContent="Renseignez les trois lieux.";return}
const btn=ICI.$("#go");btn.disabled=true;try{ICI.$("#status").textContent="Recherche des lieux…";const A=await ICI.geocode(qA);await ICI.sleep(1100);const B=await ICI.geocode(qB);await ICI.sleep(1100);const M=await ICI.geocode(qM);ICI.$("#status").textContent="Calcul des trajets…";const [rA,rB]=await Promise.all([ICI.route(A,M),ICI.route(B,M)]);const all=[...rA.geometry.coordinates,...rB.geometry.coordinates];const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),box={w:Math.min(...xs),e:Math.max(...xs),s:Math.min(...ys),n:Math.max(...ys)};const dx=box.e-box.w,dy=box.n-box.s;box.w-=dx*.08;box.e+=dx*.08;box.s-=dy*.08;box.n+=dy*.08;const fs=await ICI.features(box,false);const p=ICI.projector(all),t=ICI.themes[theme];let s=ICI.base("NOS CHEMINS","Deux départs. Une rencontre.",t)+ICI.featureSvg(fs,p,t,false);s+='<path d="'+p.path(rA.geometry.coordinates)+'" fill="none" stroke="'+t.a+'" stroke-width="7" stroke-linecap="round"/><path d="'+p.path(rB.geometry.coordinates)+'" fill="none" stroke="'+t.b+'" stroke-width="7" stroke-linecap="round"/>';const pa=p.project([A.lon,A.lat]),pb=p.project([B.lon,B.lat]),pm=p.project([M.lon,M.lat]);s+='<circle cx="'+pa[0]+'" cy="'+pa[1]+'" r="10" fill="'+t.bg+'" stroke="'+t.a+'" stroke-width="4"/><circle cx="'+pb[0]+'" cy="'+pb[1]+'" r="10" fill="'+t.bg+'" stroke="'+t.b+'" stroke-width="4"/><circle cx="'+pm[0]+'" cy="'+pm[1]+'" r="15" fill="'+t.bg+'" stroke="'+t.ink+'" stroke-width="5"/>';s+=ICI.bottom(ICI.short(qM),"L’endroit où tout a commencé.",t,(rA.distance/1000).toFixed(1)+" km · "+(rB.distance/1000).toFixed(1)+" km");ICI.$("#poster").innerHTML=s;ICI.$("#preview").classList.add("show");ICI.$("#status").textContent="Carte générée."}catch(e){ICI.$("#status").textContent=e.message}finally{btn.disabled=false}};
ICI.$("#png").onclick=()=>ICI.download("poster","ici-nos-chemins",true);ICI.$("#svg").onclick=()=>ICI.download("poster","ici-nos-chemins-apercu",false);
</script></body></html>
