<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notre histoire — ICI.</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="shell">
<header class="topbar"><a class="brand" href="../">ICI. <small>par CartoKob</small></a><nav class="nav"><a href="../">Boutique</a><a href="/">CartoKob</a></nav></header>
<a class="back" href="../">← Retour à la boutique</a>
<section class="hero"><div class="kicker">Produit 03</div><h1>Notre histoire</h1><p>Trois à cinq lieux, chacun avec sa propre mini-carte.</p></section>
<div class="form"><div class="field"><label>01 · Notre rencontre</label><input id="s1"></div><div class="field"><label>02 · Premier rendez-vous</label><input id="s2"></div><div class="field"><label>03 · Premier chez-nous</label><input id="s3"></div><div class="field"><label>04 · Optionnel</label><input id="s4"></div><div class="field"><label>05 · Optionnel</label><input id="s5"></div></div>
<div class="controls"><button class="pill active" data-theme="epure">Épure</button><button class="pill" data-theme="night">Nuit</button><button class="pill" data-theme="atlas">Atlas</button><button class="pill" data-theme="vintage">Vintage</button></div>
<button class="generate" id="go">Générer ma carte</button><div class="status" id="status"></div>
<div class="preview" id="preview"><div class="poster"><svg id="poster" viewBox="0 0 800 1000"></svg></div><div class="actions"><button class="btn dark" id="png">Télécharger SD</button><button class="btn" id="svg">SVG aperçu</button></div></div>
<footer class="footer">ICI. par CartoKob</footer></main>
<script src="../assets/core.js"></script><script>
let theme="epure";ICI.$$("[data-theme]").forEach(b=>b.onclick=()=>{theme=b.dataset.theme;ICI.$$("[data-theme]").forEach(x=>x.classList.toggle("active",x===b))});
ICI.$("#go").onclick=async()=>{const vals=[1,2,3,4,5].map(i=>ICI.$("#s"+i).value.trim()).filter(Boolean);if(vals.length<3){ICI.$("#status").textContent="Renseignez au moins trois lieux.";return}const btn=ICI.$("#go");btn.disabled=true;try{const pts=[];for(let i=0;i<vals.length;i++){ICI.$("#status").textContent="Recherche "+(i+1)+"/"+vals.length+"…";pts.push(await ICI.geocode(vals[i]));if(i<vals.length-1)await ICI.sleep(1100)}const t=ICI.themes[theme],labels=["Notre rencontre","Premier rendez-vous","Premier chez-nous","Une étape importante","Aujourd’hui"],layouts=vals.length===3?[{x:46,y:180,w:708,h:185},{x:46,y:385,w:708,h:185},{x:46,y:590,w:708,h:185}]:[{x:46,y:180,w:338,h:245},{x:416,y:180,w:338,h:245},{x:46,y:445,w:338,h:245},{x:416,y:445,w:338,h:245},{x:231,y:710,w:338,h:100}];let s=ICI.base("NOTRE HISTOIRE",vals.length+" chapitres.",t);for(let i=0;i<vals.length;i++){const P=pts[i],km=.85,latR=km/111.32,lonR=km/(111.32*Math.max(.25,Math.cos(P.lat*Math.PI/180))),box={s:P.lat-latR,w:P.lon-lonR,n:P.lat+latR,e:P.lon+lonR};ICI.$("#status").textContent="Mini-carte "+(i+1)+"/"+vals.length+"…";const fs=await ICI.features(box,false),r=layouts[i],bounds=[[box.w,box.s],[box.e,box.s],[box.e,box.n],[box.w,box.n]],p=ICI.projector(bounds,r,6),pt=p.project([P.lon,P.lat]);s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="16" fill="'+t.bg+'" stroke="'+t.ink+'" stroke-opacity=".12"/>'+ICI.featureSvg(fs.filter(f=>f.kind==="road"),p,t,false)+'<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="10" fill="'+t.bg+'" stroke="'+([t.a,t.b,t.ink,t.road,"#b89252"][i])+'" stroke-width="3"/><text x="'+(r.x+14)+'" y="'+(r.y+22)+'" font-family="Georgia" font-size="10" fill="'+t.ink+'" opacity=".55">0'+(i+1)+'</text><text x="'+(r.x+14)+'" y="'+(r.y+r.h-30)+'" font-family="Georgia" font-size="13" font-weight="700" fill="'+t.ink+'">'+ICI.esc(labels[i])+'</text><text x="'+(r.x+14)+'" y="'+(r.y+r.h-13)+'" font-family="Georgia" font-size="10" fill="'+t.ink+'" opacity=".55">'+ICI.esc(ICI.short(vals[i]))+'</text>'}s+=ICI.bottom("Notre histoire","Chaque lieu garde sa propre carte.",t,vals.length+" chapitres");ICI.$("#poster").innerHTML=s;ICI.$("#preview").classList.add("show");ICI.$("#status").textContent="Carte générée."}catch(e){ICI.$("#status").textContent=e.message}finally{btn.disabled=false}};
ICI.$("#png").onclick=()=>ICI.download("poster","ici-notre-histoire",true);ICI.$("#svg").onclick=()=>ICI.download("poster","ici-notre-histoire-apercu",false);
</script></body></html>
